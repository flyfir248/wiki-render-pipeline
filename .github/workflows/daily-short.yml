# Makes today's videos from niche Wikipedia articles and uploads them:
# two Shorts a day, plus one long (~8 min) video every Saturday.
# The video, thumbnail, captions and a ready-to-paste youtube.txt are kept as the
# run's artifact. Setup: see "Daily uploads with GitHub Actions" in the README.
name: Daily videos

on:
  schedule:
    # A Short at each of these times (UTC). Uploads go live at a random time within
    # youtube.publish_jitter_minutes after the video is ready (see channel.yaml).
    - cron: "0 14 * * *"
    - cron: "0 22 * * *"
    # The weekly long video: Saturdays 06:00 UTC. Keep this line in sync with FORMAT below.
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      format:
        description: "Short or long video"
        type: choice
        options: [short, long]
        default: short
      count:
        description: "How many videos to make"
        default: "1"

concurrency: daily-short

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # a long video takes about an hour to render on the free runner
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install
        run: |
          pip install -r requirements.txt
          (cd renderer && npm ci)

      - name: Cache Kokoro voice model
        uses: actions/cache@v5
        with:
          path: assets/kokoro
          key: kokoro-v1.0

      # The topic queue (which articles are already used) lives in jobs/state.db.
      # Each run restores the newest copy and saves a new one.
      - name: Restore topic queue
        uses: actions/cache/restore@v5
        with:
          path: jobs/state.db
          key: fyt-state-${{ github.run_id }}
          restore-keys: fyt-state-

      - name: Make today's video
        env:
          FORMAT: ${{ github.event.schedule == '0 6 * * 6' && 'long' || inputs.format || 'short' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m fyt --format "$FORMAT" run --count ${{ inputs.count || 1 }}

      - name: Save topic queue
        if: always()
        uses: actions/cache/save@v5
        with:
          path: jobs/state.db
          key: fyt-state-${{ github.run_id }}

      - name: Keep the videos for a week
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: videos-${{ github.run_id }}
          path: |
            jobs/*/video.mp4
            jobs/*/thumbnail.png
            jobs/*/captions.srt
            jobs/*/youtube.txt
            jobs/*/script.json
            jobs/*/research.md
            jobs/*/job.json
          retention-days: 7
          if-no-files-found: ignore
