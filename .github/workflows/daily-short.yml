# Keeps the channel's upload schedule filled: two Shorts a day (14:00 and 22:00 UTC)
# and one ~8 minute video every Saturday (16:00 UTC), made from niche Wikipedia articles.
#
# Every run tops up the next two days of publish slots (`python -m fyt fill`, see
# `schedule` in channel.yaml). Videos are uploaded ahead of time as scheduled videos,
# so a failed or skipped run doesn't cost a publish: the next run refills the gap.
# With what's left of the day's quota, it adds a bonus Short (daily) or long video (weekly)
# on a topic trending on Wikipedia, when one fits the channel.
# If a slot in the next 24 hours is still empty after a run, the run fails and opens
# an issue in this repo, which GitHub emails to you.
# Setup: see "Daily uploads with GitHub Actions" in the README.
name: Daily videos

on:
  schedule:
    # Four chances a day to top up the schedule. A run with nothing to do takes about a minute.
    - cron: "17 1,7,13,19 * * *"
    # Right after the Shorts go public (14:00 and 22:00 UTC, up to 90 minutes later with the
    # jitter): post them to Instagram, Facebook and Threads, so they come out with the Short.
    - cron: "40 15,23 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "fill: top up the schedule. short / long: make one video now. news: a long explainer on a recent incident. relabel: clear the AI-content label on videos already up. stats: what the channel's numbers say. playlists: file every video into its series playlist. posts: draft this week's Community posts now. reels: post Shorts that are public on YouTube to Instagram, Facebook and Threads now. assetcheck: test story-driven 3D on a fixed panel of things (report in the run summary). bench: render the 8-second 3D quality benchmark (contact sheet, render time and look check in the run summary). kit: fetch the CC0 character kit into the model library (inventory in the run summary). replace: upload a reviewed test render (its run id in replay) in place of the same article's Short or long video still scheduled on YouTube, at its publish time; the old one is made private"
        type: choice
        options: [fill, short, long, news, relabel, stats, playlists, posts, reels, assetcheck, bench, kit, replace]
        default: fill
      upload:
        description: "Upload (for short / long; off only renders the video and keeps it as an artifact)"
        type: boolean
        default: true
      count:
        description: "How many videos (for short / long); for reels, how many days back to catch up"
        default: "1"
      title:
        description: "For news: the incident's Wikipedia article title (blank picks the strongest recent one). For short / long: render that article as a test, without uploading"
        default: ""
      replay:
        description: "For a test render: the run id of an earlier test of the same title, to re-render its saved script and story without writing them again (far fewer minutes)"
        default: ""

# A test render (short / long with a title) never uploads or touches the schedule, so it runs in a group
# of its own: a scheduled run can't cancel it while it waits, and it never holds up the schedule.
concurrency:
  group: ${{ ((inputs.title != '' && (inputs.task == 'short' || inputs.task == 'long')) || inputs.task == 'bench' || inputs.task == 'kit') && format('test-render-{0}', github.run_id) || 'daily-videos' }}
  cancel-in-progress: false

permissions:
  contents: write # to keep the 3D models found for stories on the asset-library branch
  actions: write # to fetch a video again from the run that made it, and delete old runs
  issues: write # for the alert when the schedule runs low

jobs:
  make:
    runs-on: ubuntu-latest
    # fill stops starting new videos after 120 minutes; a test render waits out Groq's free
    # rate limits on every step, so it gets longer
    timeout-minutes: ${{ inputs.title != '' && (inputs.task == 'short' || inputs.task == 'long') && 330 || 170 }}
    env:
      TASK: ${{ inputs.task || (github.event.schedule == '40 15,23 * * *' && 'reels') || 'fill' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # The topic queue and the upload schedule live in jobs/state.db; videos whose
      # upload failed wait in jobs/pending, and scripts for Shorts cut from long videos in jobs/cuts. Each run restores the newest copy and saves a new one.
      # Changing this path list starts a fresh cache; `fill` then rebuilds the schedule from the channel's uploads.
      - name: Restore schedule
        uses: actions/cache/restore@v5
        with:
          path: |
            jobs/state.db
            jobs/pending
            jobs/cuts
          key: fyt-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fyt-state-

      # Each video's question goes up as the channel's first comment once the video is public.
      - name: Post first comments
        if: env.TASK == 'fill'
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m fyt comments

      # Shorts that have gone public on YouTube go up as Instagram Reels, Facebook Reels and Threads posts,
      # with their files fetched from the run that made them. Only for the platforms with publish: true in
      # channel.yaml and their secrets set.
      - name: Post Shorts to Instagram, Facebook and Threads
        if: env.TASK == 'fill' || env.TASK == 'reels'
        continue-on-error: true
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.count || '1' }}
        # task reels with count N catches up on the last N days (the runs keep their videos for a week)
        run: python -m fyt reels $([ "$TASK" = reels ] && [ "$COUNT" -gt 1 ] && echo "--hours $((COUNT * 24))")

      # Uploads YouTube never finished processing: their slots are freed and their files, fetched from
      # the run that made them, go back in jobs/pending so this run uploads them again. Sent as an issue.
      - name: Check recent uploads went through
        if: env.TASK == 'fill'
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m fyt watchdog --out watchdog.md
          if [ -f watchdog.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "YouTube didn't process $(grep -c '^| \[' watchdog.md) upload(s)" --body-file watchdog.md
          fi

      # Old runs leave the Actions tab once nothing needs them: a run that uploaded videos only when
      # YouTube has processed each one and every platform posting Shorts has posted it (the steps above
      # fetch the files from its artifact until then), anything else a day after it ran (see fyt/cleanup.py).
      - name: Delete old runs
        if: env.TASK == 'fill'
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m fyt cleanruns

      # Older videos are filed into the series playlists a few at a time, to spare the upload quota.
      - name: Organise playlists
        if: env.TASK == 'fill' || env.TASK == 'playlists'
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNT: ${{ inputs.count || '1' }}
        # By hand: up to `count` changes (40 when count is 1); each costs 50 of the 10,000 daily quota units.
        run: python -m fyt playlists --max $([ "$TASK" = playlists ] && { [ "$COUNT" -gt 1 ] && echo "$COUNT" || echo 40; } || echo 8)

      # Drafts for the Community tab (YouTube has no API to post them), sent as an issue, which GitHub
      # emails to you once a week. Posts reach subscribers and viewers between uploads.
      - name: Draft Community posts
        if: env.TASK == 'fill' || env.TASK == 'posts'
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m fyt posts --out posts.md $([ "$TASK" = posts ] && echo --now)
          if [ -f posts.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Community posts for the week of $(date -u +'%d %B')" --body-file posts.md
          fi

      - name: Check what the schedule needs
        id: need
        run: |
          if [ "$TASK" = fill ]; then
            echo "needed=$(python -m fyt buffer --needed)" >> "$GITHUB_OUTPUT"
          elif [ "$TASK" = relabel ] || [ "$TASK" = stats ] || [ "$TASK" = playlists ] || [ "$TASK" = posts ] || [ "$TASK" = reels ] || [ "$TASK" = replace ]; then
            echo "needed=no" >> "$GITHUB_OUTPUT"
          else
            echo "needed=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.need.outputs.needed == 'yes'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install the renderer
        if: steps.need.outputs.needed == 'yes'
        run: cd renderer && npm ci

      - name: Cache Kokoro voice model
        if: steps.need.outputs.needed == 'yes'
        uses: actions/cache@v5
        with:
          path: assets/kokoro
          key: kokoro-v1.0

      - name: Cache the cut-out model for the collage look
        if: steps.need.outputs.needed == 'yes'
        uses: actions/cache@v5
        with:
          path: assets/cutout
          key: cutout-isnet-general-use

      # 3D models found for stories (fyt/assetlib.py) live on the asset-library branch, with their source,
      # author and licence, so every later video reuses them instead of searching again.
      - name: Restore the 3D model library
        if: steps.need.outputs.needed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch asset-library "$url" assets/models; then
            mkdir -p assets/models
            (cd assets/models && git init --quiet -b asset-library && git remote add origin "$url")
          fi
          ls assets/models

      # Objaverse's index of downloadable models (about 20 MB), fetched once.
      - name: Cache the Objaverse model index
        if: steps.need.outputs.needed == 'yes'
        uses: actions/cache@v5
        with:
          path: assets/models/_objaverse
          key: objaverse-paths-v1

      - name: Clear the AI-content label on videos already up
        if: env.TASK == 'relabel'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m fyt relabel

      # A test render that was reviewed and liked replaces the article's scheduled video: its files come
      # from the test run's artifact, it takes the old video's publish time and slot, and the old video is
      # made private (still on the channel, so it can be brought back in YouTube Studio).
      - name: Replace a scheduled video with a reviewed test render
        if: env.TASK == 'replace'
        env:
          REPLAY: ${{ inputs.replay }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$REPLAY" ] || { echo "replace needs the test render's run id in replay"; exit 1; }
          mkdir -p jobs
          gh run download "$REPLAY" --repo "$GITHUB_REPOSITORY" --name "videos-$REPLAY-1" --dir jobs
          job=$(ls -d jobs/*/ | grep -v -e '/pending/' -e '/cuts/' -e '/bench/' | head -1)
          [ -f "$job/video.mp4" ] || { echo "run $REPLAY kept no video"; exit 1; }
          python -m fyt replace "$job" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Channel stats and watch-time lessons
        if: env.TASK == 'stats'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m fyt stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Make videos
        if: steps.need.outputs.needed == 'yes'
        env:
          UPLOAD: ${{ inputs.upload }}
          COUNT: ${{ inputs.count || '1' }}
          TITLE: ${{ inputs.title }}
          REPLAY: ${{ inputs.replay }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          # Optional, free: more 3D model sources for story entities (see fyt/assetlib.py).
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          POLY_PIZZA_KEY: ${{ secrets.POLY_PIZZA_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMAGE_TO_3D_URL: ${{ secrets.IMAGE_TO_3D_URL }}
          IMAGE_TO_3D_TOKEN: ${{ secrets.IMAGE_TO_3D_TOKEN }}
          IMAGE_TO_3D_SPACE: ${{ vars.IMAGE_TO_3D_SPACE }}
        run: |
          if [ "$TASK" = fill ]; then
            python -m fyt fill
          elif [ "$TASK" = assetcheck ]; then
            python -m fyt assetcheck --out jobs/assetcheck
            cat jobs/assetcheck/report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "$TASK" = bench ]; then
            python -m fyt bench --out jobs/bench
            { echo "## 3D quality benchmark"; echo '```json'; cat jobs/bench/report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$TASK" = kit ]; then
            python -m fyt kit --out assets/models/_kit > kit.txt
            cat kit.txt | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$TASK" = news ]; then
            python -m fyt news ${TITLE:+--title "$TITLE"} $([ "$UPLOAD" = false ] && echo --no-upload)
          elif [ -n "$TITLE" ] && [ -n "$REPLAY" ]; then
            # a test re-render: the earlier test's script and story, so only the visuals are redone
            saved=$(ls -d assets/models/_runs/"$REPLAY"/*/ | head -1)
            [ -f "$saved/written.json" ] || { echo "run $REPLAY saved no written.json to replay"; exit 1; }
            python -m fyt --format "$TASK" make "wiki:$TITLE" --script "$saved/written.json" \
              $([ -f "$saved/manifest.json" ] && echo --manifest "$saved/manifest.json") --no-localize
          elif [ -n "$TITLE" ]; then
            python -m fyt --format "$TASK" make "wiki:$TITLE" --no-localize # a test render, never uploaded
          elif [ "$UPLOAD" = false ]; then
            python -m fyt --format "$TASK" run --count "$COUNT" --no-upload
          else
            python -m fyt --format "$TASK" run --count "$COUNT"
          fi

      - name: 3D coverage in the run summary
        if: always()
        run: |
          for f in jobs/*/coverage.md; do
            if [ -f "$f" ]; then { echo "### $(basename "$(dirname "$f")")"; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"; fi
          done

      # New models go back to the library branch. A test render (a title given) also leaves its contact
      # sheet, manifest, model registry and relevance verdicts there under _runs/, to review the result.
      - name: Save new 3D models
        if: always() && steps.need.outputs.needed == 'yes'
        env:
          TITLE: ${{ inputs.title }}
          RUN: ${{ github.run_id }}
        run: |
          cd assets/models || exit 0
          printf '_objaverse/\n' > .gitignore
          if [ -n "$TITLE" ]; then
            for job in ../../jobs/*/; do
              out="_runs/$RUN/$(basename "$job")"
              mkdir -p "$out"
              for f in contact.png manifest.json written.json assets.json relevance.json visualplan.json world.json script.json qc.json look.json coverage.json coverage.md log.txt; do
                if [ -f "$job/$f" ]; then cp "$job/$f" "$out/"; fi
              done
              cp "$job"/gate/*.png "$out/" 2>/dev/null || true
              cp "$job"/look/*.jpg "$out/" 2>/dev/null || true
            cp "$job"/thumbnail*.png "$job"/thumbnail-choice.json "$out/" 2>/dev/null || true
              if [ -f "$job/video.mp4" ]; then
                "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" -loglevel error -y -i "$job/video.mp4" -vf scale=-2:640 -b:v 350k -c:a aac -b:a 64k "$out/preview.mp4" || true
              fi
            done
          fi
          if [ -f ../../jobs/bench/report.json ]; then
            mkdir -p "_checks/bench-$RUN"
            cp ../../jobs/bench/report.json ../../jobs/bench/contact.png "_checks/bench-$RUN/"
            cp ../../jobs/bench/look/*.jpg "_checks/bench-$RUN/" 2>/dev/null || true
            "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" -loglevel error -y -i ../../jobs/bench/bench.mp4 -vf scale=-2:960 -b:v 900k "_checks/bench-$RUN/bench.mp4" || true
          fi
          if [ -f ../../jobs/assetcheck/report.md ]; then
            mkdir -p "_checks/$RUN"
            cp ../../jobs/assetcheck/report.md ../../jobs/assetcheck/report.json ../../jobs/assetcheck/sheet.png "_checks/$RUN/"
            cp -r ../../jobs/assetcheck/frames "_checks/$RUN/" 2>/dev/null || true
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "3D models and test renders from run $RUN"
            # other runs (a scheduled one, or test renders running side by side) may have pushed meanwhile:
            # rebase onto theirs, keeping both runs' entries in the shared indexes, and try again
            export GIT_COMMITTER_NAME="github-actions[bot]" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            for try in 1 2 3 4 5 6; do
              git push --quiet origin HEAD:asset-library && break
              [ "$try" = 6 ] && exit 1
              sleep $((try * 3))
              git fetch --quiet origin asset-library
              if ! git rebase --quiet origin/asset-library >/dev/null 2>&1; then
                for step in 1 2 3 4 5 6 7 8; do
                  [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ] || break
                  python -c "import sys; sys.path.insert(0, '../..'); from fyt.assetlib import settle_rebase; settle_rebase()"
                  git -c core.editor=true rebase --continue >/dev/null 2>&1 || true
                done
              fi
            done
          fi

      - name: Check the schedule
        if: always() && env.TASK == 'fill'
        run: |
          echo "## Upload schedule" >> "$GITHUB_STEP_SUMMARY"
          python -m fyt buffer --check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save schedule
        if: always() && !(inputs.title != '' && (inputs.task == 'short' || inputs.task == 'long'))
        uses: actions/cache/save@v5
        with:
          path: |
            jobs/state.db
            jobs/pending
            jobs/cuts
          key: fyt-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the videos for a week
        if: always() && (steps.need.outputs.needed == 'yes' || env.TASK == 'replace')
        uses: actions/upload-artifact@v6
        with:
          name: videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            jobs/*/video.mp4
            jobs/*/thumbnail.png
            jobs/*/captions.srt
            jobs/*/youtube.txt
            jobs/*/instagram.txt
            jobs/*/script.json
            jobs/*/research.md
            jobs/*/job.json
            jobs/*/localizations.json
            jobs/*/props.json
            jobs/*/shotlist.json
            jobs/*/visualplan.json
            jobs/*/qc.json
            jobs/*/contact.png
            jobs/*/manifest.json
            jobs/*/assets.json
            jobs/*/relevance.json
            jobs/*/look.json
            jobs/*/coverage.json
            jobs/bench/bench.mp4
            jobs/bench/report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Alert when the schedule needs attention
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upload schedule needs attention"
          body="Run $RUN failed or left a publish slot in the next 24 hours without a video. The next run (every 6 hours) retries automatically; the run's summary shows the schedule and the log shows what failed."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close the alert once the schedule is healthy
        if: success() && env.TASK == 'fill'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Upload schedule needs attention" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The schedule is full again."
          fi
