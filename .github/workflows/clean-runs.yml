# Clears old runs out of the Actions tab once nothing needs them any more. A run whose videos
# artifact is still live is kept: Reels are posted from it when the Short goes public (up to
# 2 days after upload, then up to 48 hours to post), and the watchdog re-uploads a broken video
# from it. So a run that made videos goes once its artifact expires (7 days), and a run that
# made none goes after a day. Failed runs stay a week, to read their logs.
name: Clean old runs

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: clean-runs

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          day=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          week=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # runs whose artifacts can still be fetched
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id' | sort -u > live
          gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100&created=%3C$day" \
            --jq '.workflow_runs[]
              | select((.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")
                       and .created_at > "'"$week"'" | not)
              | .id' | sort -u > old
          deleted=0
          for id in $(comm -23 old live); do
            [ "$id" = "$SELF" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" --silent && deleted=$((deleted + 1))
          done
          echo "Deleted $deleted runs; kept $(wc -l < live) with live artifacts" >> "$GITHUB_STEP_SUMMARY"
