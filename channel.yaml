# Config used by the daily GitHub Actions run (.github/workflows/daily-short.yml).
# See channel.example.yaml for every option.

channel:
  name: "FacelessYT"
  niche: "strange, little-known true stories and facts from history, science and the world"
  audience: "curious people who love weird-but-true facts"
  tone: "intriguing, warm, fast-paced storytelling; no hype or clickbait lies"
  language: en

format: short          # `fill` picks short or long per publish slot
target_minutes: 8      # length of the long videos

# Scripts are written by a free open model on Groq (secret: GROQ_API_KEY).
# To use Claude instead: provider: anthropic (secret: ANTHROPIC_API_KEY).
llm:
  provider: openai
  base_url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  # Used in turn if the main model is down or out of free tokens for the day
  # (each model on Groq has its own free limits).
  fallback_models: [openai/gpt-oss-20b, llama-3.3-70b-versatile]

source: wikipedia
wikipedia:
  list_pages:
    - "Wikipedia:Unusual articles"   # Wikipedia's own list of odd, niche articles
  categories: []
  min_chars: 3000
  long_min_chars: 15000  # long videos pick articles with at least this much text

voice:
  provider: kokoro
  kokoro_voice: am_michael
  kokoro_speed: 1.05        # long videos
  kokoro_short_speed: 1.15  # Shorts: brisker read, near-zero pauses between scenes
  short_gap_seconds: 0.08

stock_footage: true     # uses PEXELS_API_KEY if set, otherwise text-only scenes
# Cloudflare's free image allowance is spent sparingly: drawings only for story scenes, not an
# illustration for every sentence. Photos get the free collage look (fyt/cutout.py) instead.
storyboard: false

youtube:
  privacy: public
  # Each video goes public at a random minute up to 90 minutes after its slot, so the
  # channel doesn't post at the exact same time every day.
  publish_jitter_minutes: 90
  category_id: "27"
  # Not needed for a narrator voice over real images; see YouTubeConfig in fyt/config.py.
  contains_synthetic_media: false
  # Caption tracks, playlists and view stats need a token with the full YouTube
  # permission (see "Caption tracks, playlists and stats" in the README). With an
  # upload-only token they're skipped. Captions are burned into the video either way.
  upload_captions: true
  # Title and description translated into these languages too (one extra LLM call each per video).
  localize: [es, pt, hi, fr, de]

# Publish slots that `python -m fyt fill` (the workflow's runs) keeps filled ahead of time.
schedule:
  short_slots: ["14:00", "22:00"]   # UTC
  long_weekday: 5                   # Saturday (Monday = 0)
  long_slot: "16:00"                # UTC
  buffer_days: 2                    # Shorts are uploaded up to 2 days before they go live
  long_lead_days: 3
  max_uploads_per_day: 4            # YouTube API quota

# Growth: sharper packaging, better topics, series, Shorts cut from long videos,
# and bonus videos on trending topics. See GrowthConfig in fyt/config.py.
growth:
  polish: true              # second pass on title, hook and thumbnail text; loop line for Shorts
  rank_topics: true         # pick articles by fit with the niche and Wikipedia readers
  min_topic_fit: 6          # 0-10
  cuts_per_long: 2          # Shorts cut from each long video, linking to it
  series:                   # a playlist each; every video is filed under one
    - Weird History
    - Strange Science
    - Bizarre Places
    - Unbelievable People
  bonus_shorts_per_day: 1   # extra Short on a trending topic that fits (if one does)
  bonus_longs_per_week: 1   # extra long video, only for a very strong trending fit
  bonus_min_fit: 7
  bonus_long_min_fit: 9
  # A weekly long explainer on a recent news incident (Wikipedia "In the news" and most read, at
  # least a day old). Factual and attributed, no speculation; see NEWS_GUIDE in fyt/llm.py.
  news_longs_per_week: 1
  news_min_fit: 8
  # Turning viewers into subscribers: the series name on screen, the reason to subscribe over a Short's
  # last seconds and on a long video's end card, and a one-click subscribe link in every description.
  series_badge: true
  subscribe_line: "Subscribe for a strange true story every day"
  end_card_seconds: 15      # add the end screen (subscribe + best video) in YouTube Studio

# true: the daily run only makes the video (download it from the run's Artifacts
# and upload by hand). false: it also uploads when the YOUTUBE_TOKEN_JSON secret is
# set; without the secret it only makes the video.
require_review: false
