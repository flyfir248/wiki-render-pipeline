# Config used by the daily GitHub Actions run (.github/workflows/daily-short.yml).
# See channel.example.yaml for every option.

channel:
  name: "FacelessYT"
  niche: "strange, little-known true stories and facts from history, science and the world"
  audience: "curious people who love weird-but-true facts"
  tone: "intriguing, warm, fast-paced storytelling; no hype or clickbait lies"
  language: en

format: short          # `fill` picks short or long per publish slot
target_minutes: 8      # length of the long videos

# Scripts are written by a free open model on Groq (secret: GROQ_API_KEY).
# To use Claude instead: provider: anthropic (secret: ANTHROPIC_API_KEY).
llm:
  provider: openai
  base_url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  # Used in turn if the main model is down or out of free tokens for the day
  # (each model on Groq has its own free limits).
  fallback_models: [openai/gpt-oss-20b, qwen/qwen3.8-27b]
  # Translations, visual planning, 3D casting and direction, storyboards and topic ranking go to these
  # first, so the main model's free daily tokens are kept for writing and checking scripts. Thin Shorts
  # came from the main model running out before the script was written.
  helper_models: [openai/gpt-oss-20b, qwen/qwen3.8-27b]
  # NVIDIA's API catalog (build.nvidia.com, secret NVIDIA_API_KEY), asked when the main model is rate
  # limited or failing, before the smaller fallbacks above: its own free limits, so runs don't all wait on
  # Groq. Skipped while the secret isn't set.
  backup:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    models: [openai/gpt-oss-120b, deepseek-ai/deepseek-v4-pro]
  # Asked last, when every model above is rate limited or out of tokens for the day: Hugging Face's router
  # (billed past its small monthly free credit), then Cloudflare Workers AI's free daily allowance, with the
  # keys the picture checks already use.
  last_resort:
    - base_url: https://router.huggingface.co/v1
      api_key_env: HF_TOKEN
      models: [Qwen/Qwen3-235B-A22B-Instruct-2507, deepseek-ai/DeepSeek-V3.1]
    - base_url: https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/v1
      api_key_env: CLOUDFLARE_API_TOKEN
      models: ["@cf/meta/llama-3.3-70b-instruct-fp8-fast"]

# Long videos use their own models, so the week's long script doesn't depend on what the Shorts left of
# the free tiers above: Google's free Gemini API first (secret GEMINI_API_KEY; without it, the models
# above), then NVIDIA, then Groq and Cloudflare. Only the long video asks Gemini, so its free daily limits are its own.
long_llm:
  provider: openai
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  # The newest Flash model the key can use (Google retires older ones for new keys), then the newest Flash-Lite.
  model: "newest:flash"
  api_key_env: GEMINI_API_KEY
  fallback_models: ["newest:flash-lite"]
  # Flash's free daily allowance is small: visual planning, casting and translations go to Flash-Lite, so
  # Flash is there for the script and the fact check.
  helper_models: ["newest:flash-lite"]
  backup:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    models: [openai/gpt-oss-120b, deepseek-ai/deepseek-v4-pro]
  last_resort:
    - base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      models: [openai/gpt-oss-120b, openai/gpt-oss-20b]
    - base_url: https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/v1
      api_key_env: CLOUDFLARE_API_TOKEN
      models: ["@cf/meta/llama-3.3-70b-instruct-fp8-fast"]

source: wikipedia
wikipedia:
  list_pages:
    - "Wikipedia:Unusual articles"   # Wikipedia's own list of odd, niche articles
  categories: []
  min_chars: 3000
  long_min_chars: 15000  # long videos pick articles with at least this much text

voice:
  provider: kokoro
  kokoro_voice: am_michael
  kokoro_speed: 1.05        # long videos
  kokoro_short_speed: 1.15  # Shorts: brisker read, near-zero pauses between scenes
  short_gap_seconds: 0.08

stock_footage: true     # uses PEXELS_API_KEY if set, otherwise text-only scenes

youtube:
  privacy: public
  # Each video goes public at a random minute up to 90 minutes after its slot, so the
  # channel doesn't post at the exact same time every day.
  publish_jitter_minutes: 90
  category_id: "27"
  # Not needed for a narrator voice over real images; see YouTubeConfig in fyt/config.py.
  contains_synthetic_media: false
  # Caption tracks, playlists and view stats need a token with the full YouTube
  # permission (see "Caption tracks, playlists and stats" in the README). With an
  # upload-only token they're skipped. Captions are burned into the video either way.
  upload_captions: true
  # Title and description translated into these languages too (one extra LLM call each per video).
  localize: [es, pt, hi, fr, de]

# Publish slots that `python -m fyt fill` (the workflow's runs) keeps filled ahead of time.
schedule:
  short_slots: ["14:00", "22:00"]   # UTC
  long_weekday: 5                   # Saturday (Monday = 0)
  long_slot: "16:00"                # UTC
  buffer_days: 2                    # Shorts are uploaded up to 2 days before they go live
  long_lead_days: 5                 # made from Monday, so several runs get a chance at it
  max_uploads_per_day: 4            # YouTube API quota
  # Both Shorts are kept for what's in the news that day: filled about 9 hours ahead with the
  # trending Wikipedia article that fits best (growth.bonus_min_fit), else an evergreen topic.
  # Trending Shorts got about twice the first-week views of evergreen ones (`stats` task).
  timely_slots: ["14:00", "22:00"]
  timely_hold_hours: 10
  min_gap_hours: 3                  # no two Shorts go public closer together than this (bonus ones included)

# Growth: sharper packaging, better topics, series, Shorts cut from long videos,
# and bonus videos on trending topics. See GrowthConfig in fyt/config.py.
growth:
  polish: true              # second pass on title, hook and thumbnail text; loop line for Shorts
  rank_topics: true         # pick articles by fit with the niche and Wikipedia readers
  min_topic_fit: 6          # 0-10
  cuts_per_long: 2          # Shorts cut from each long video, linking to it
  # The weekly long video tells the full story of the recent Short with the most views (at least 300,
  # public 2+ days, from the last 3 weeks), else a fresh article. In October the best Shorts got 1,000+
  # views while long videos on fresh articles got 2-40.
  long_from_shorts: true
  series:                   # a playlist each; every video is filed under one
    - Weird History
    - Strange Science
    - Bizarre Places
    - Unbelievable People
  bonus_shorts_per_day: 1   # extra Short on a trending topic that fits (if one does)
  bonus_short_min_fit: 8    # only for a strong trend: the two daily Shorts already follow what's trending
  # Off while the weekly long video gets the run time and the free model tokens: no long video went out
  # after 17 Oct because the Shorts used them first. Bonus and news long videos got 2-16 views each.
  bonus_longs_per_week: 0   # extra long video, only for a very strong trending fit
  bonus_min_fit: 7
  bonus_long_min_fit: 9
  # A weekly long explainer on a recent news incident (Wikipedia "In the news" and most read, at
  # least a day old). Factual and attributed, no speculation; see NEWS_GUIDE in fyt/llm.py.
  news_longs_per_week: 0
  news_min_fit: 8
  # Turning viewers into subscribers: the series name on screen, the reason to subscribe over a Short's
  # last seconds and on a long video's end card, and a one-click subscribe link in every description.
  series_badge: true
  subscribe_line: "Subscribe for a strange true story every day"
  subscribe_lines:          # said instead on some videos, so they don't all end the same way
    - "Follow for a weird true story every day"
    - "Subscribe: one strange true story a day"
    - "More true stories like this every day"
    - "Subscribe for tomorrow's strange true story"
  end_card_seconds: 15      # add the end screen (subscribe + best video) in YouTube Studio

# Shorts cross-posted as Instagram Reels, pointing viewers to the YouTube channel (fyt/instagram.py).
# Every Short gets instagram.txt (caption, call to action, hashtags) in the run's artifact.
# Posting needs the INSTAGRAM_TOKEN and INSTAGRAM_USER_ID secrets; see "Instagram Reels" in the README.
instagram:
  enabled: true
  publish: true             # each Short goes up as a Reel once it is public on YouTube
  youtube_handle: "@WeirdButTrueOfficialHQ"   # named in every caption
  cta: "Full story, and a new one every day, on YouTube. Link in bio"
  hashtags: [truestory, didyouknow]   # in every caption; the video's own tags fill the rest
  max_hashtags: 5           # Instagram's limit per post
  host: litterbox           # Instagram fetches each Reel from a link on litterbox.catbox.moe, deleted after 1 hour

# The same Shorts as Reels on the Facebook Page linked to the Instagram account, with a link to the
# Short on YouTube. Uses INSTAGRAM_TOKEN, which needs the pages_manage_posts permission too.
facebook:
  publish: true

# The same Shorts on Threads, with a link to the Short on YouTube. Needs the THREADS_TOKEN and
# THREADS_APP_SECRET secrets; see "Facebook and Threads" in the README.
threads:
  publish: true
  topic: "Weird History"    # Threads takes one topic tag per post

# true: the daily run only makes the video (download it from the run's Artifacts
# and upload by hand). false: it also uploads when the YOUTUBE_TOKEN_JSON secret is
# set; without the secret it only makes the video.
require_review: false
