# Config used by the daily GitHub Actions run (.github/workflows/daily-short.yml).
# See channel.example.yaml for every option.

channel:
  name: "FacelessYT"
  niche: "strange, little-known true stories and facts from history, science and the world"
  audience: "curious people who love weird-but-true facts"
  tone: "intriguing, warm, fast-paced storytelling; no hype or clickbait lies"
  language: en

format: short

source: wikipedia
wikipedia:
  list_pages:
    - "Wikipedia:Unusual articles"   # Wikipedia's own list of odd, niche articles
  categories: []
  min_chars: 3000

voice:
  provider: kokoro
  kokoro_voice: am_michael
  kokoro_speed: 1.05

stock_footage: true     # uses PEXELS_API_KEY if set, otherwise text-only scenes

youtube:
  privacy: public       # forced to private by YouTube until the API project is audited
  category_id: "27"
  contains_synthetic_media: true

# true: the daily run only makes the video (download it from the run's Artifacts
# and upload by hand). false: it also uploads (needs the YOUTUBE_TOKEN_JSON secret).
require_review: true
