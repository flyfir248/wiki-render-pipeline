# Copy to channel.yaml and edit. Everything here has a sensible default.

channel:
  name: "My Channel"
  niche: "surprising explainers about money, science and history"   # <- set your niche later
  audience: "curious adults who want clear, fact-checked explanations"
  tone: "confident, warm, fast-paced, no hype or clickbait lies"
  language: en

format: long            # long (16:9) or short (9:16, < 60s)
target_minutes: 6       # long videos only; 8+ minutes allows mid-roll ads

model: claude-opus-5
llm:
  provider: anthropic   # anthropic (Claude) | openai (any OpenAI-compatible API, e.g. Groq's free tier)
  base_url: https://api.groq.com/openai/v1       # openai only; Ollama: http://localhost:11434/v1
  model: openai/gpt-oss-120b                     # openai only
  api_key_env: GROQ_API_KEY                      # openai only
  helper_models: []    # openai only: smaller models for translations, visual planning, 3D casting and topic ranking, keeping `model` for scripts
source: web             # web: Claude researches each topic | wikipedia: videos from niche Wikipedia articles
research: true          # Claude web research before scripting (source: web)
wikipedia:              # used when source: wikipedia (or for "wiki:<Title>" topics)
  list_pages: ["Wikipedia:Unusual articles"]   # every article these pages link to is a candidate
  categories: []        # e.g. ["Unsolved problems in physics"]
  articles: []          # specific article titles
  min_chars: 3000       # skip stubs
  long_min_chars: 15000 # long videos need an article with enough material

voice:
  provider: kokoro      # kokoro (free, local, natural) | edge (free) | elevenlabs (paid) | espeak (offline) | silent (testing)
  kokoro_voice: am_michael   # e.g. af_heart, am_michael, bm_george, bf_emma
  kokoro_speed: 1.05         # long videos
  kokoro_short_speed: 1.15   # Shorts
  edge_voice: en-US-AndrewMultilingualNeural     # list: edge-tts --list-voices
  edge_rate: "+5%"
  elevenlabs_voice_id: JBFqnCBsd6RMkjVDRZzb
  elevenlabs_model: eleven_multilingual_v2
  gap_seconds: 0.3          # pause between scenes in long videos
  short_gap_seconds: 0.08   # and in Shorts

music_dir: assets/music # drop licensed royalty-free tracks here (mp3/wav)
music_volume: 0.07
stock_footage: true     # needs PEXELS_API_KEY; broll scenes fall back to text otherwise
captions: true
visualizer: true

theme:                  # your channel's look; keep it consistent
  background: "#0b1020"
  background2: "#1b2350"
  accent: "#ffcc33"
  accent2: "#4dd6ff"
  text: "#ffffff"
  muted: "#a9b3d6"

youtube:
  privacy: private      # private | unlisted | public
  category_id: "27"     # 27 Education, 28 Science & Tech, 22 People & Blogs
  made_for_kids: false
  contains_synthetic_media: true   # AI voice => disclose
  publish_delay_hours: null        # e.g. 24 to schedule publishing a day after upload
  publish_jitter_minutes: 0        # e.g. 90: go public at a random minute up to 90 min later
  upload_captions: true

instagram:              # Shorts also posted as Instagram Reels (see README)
  enabled: false
  publish: false
  youtube_handle: ""
  hashtags: []
  max_hashtags: 5
facebook:               # the same Shorts as Reels on the linked Facebook Page (see README)
  publish: false
threads:                # the same Shorts on Threads, with a link to YouTube (see README)
  publish: false
  topic: ""

require_review: true    # videos wait for `fyt approve` before upload

seed_topics:            # used first; after that Claude proposes topics
  - "Why compound interest is called the eighth wonder of the world"
  - "How the Rule of 72 predicts when your money doubles"
